<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#052d4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="さかなタップ">
<link rel="manifest" href="./manifest.webmanifest">
<title>さかなタップ！Ver.2</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#052d4d;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
body{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
.hud{position:fixed;z-index:10;left:10px;right:10px;top:max(10px,env(safe-area-inset-top));display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.card{background:rgba(3,34,56,.62);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:17px;padding:9px 12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.title{font-weight:800;font-size:17px}
.sub{font-size:11px;opacity:.9;margin-top:2px}
.stats{display:flex;gap:7px;align-items:center}
.stat{font-weight:800;font-size:14px;white-space:nowrap}
.bottom{position:fixed;z-index:12;left:8px;right:8px;bottom:max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
button{appearance:none;border:1px solid rgba(255,255,255,.28);background:rgba(2,43,67,.72);color:#fff;border-radius:15px;padding:9px 4px;font-weight:800;font-size:11px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 5px 14px rgba(0,0,0,.16)}
button:active{transform:scale(.96)}
button .ico{display:block;font-size:21px;margin-bottom:2px}
.modal{position:fixed;z-index:30;inset:0;background:rgba(0,20,35,.72);display:none;align-items:flex-end;justify-content:center;padding:10px}
.modal.open{display:flex}
.sheet{width:min(680px,100%);max-height:78vh;overflow:auto;background:#f7fbff;border-radius:24px 24px 18px 18px;padding:16px;color:#08324d;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet h2{margin:0 0 12px;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fishcard{border:1px solid #cfe2ef;border-radius:16px;padding:10px;background:#fff}
.fishcard.locked{filter:grayscale(1);opacity:.55}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#e9f4fb;font-size:11px;font-weight:700}
.name{font-weight:800;margin-top:7px}
.small{font-size:12px;color:#5d7484}
.close{width:100%;margin-top:14px;background:#0c719e;font-size:15px}
.toast{position:fixed;z-index:40;left:50%;top:22%;transform:translate(-50%,-50%) scale(.9);opacity:0;pointer-events:none;background:rgba(0,28,46,.8);color:#fff;padding:10px 15px;border-radius:999px;font-weight:800;transition:.18s}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.level{position:fixed;z-index:11;left:10px;top:88px;width:150px;height:9px;border-radius:999px;background:rgba(255,255,255,.24);overflow:hidden}
.level>div{height:100%;width:0;background:linear-gradient(90deg,#ffe176,#ff9d42)}
.install{position:fixed;z-index:14;right:10px;bottom:78px;display:none;background:#fff;color:#0b5273;border:0;padding:9px 12px;font-size:12px;border-radius:999px}
@media (min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.bottom{left:50%;transform:translateX(-50%);width:650px}.card{padding:11px 15px}.title{font-size:20px}}
</style>
</head>
<body>
<canvas id="game" aria-label="魚を集めて育てる水族館ゲーム"></canvas>

<div class="hud">
  <div class="card">
    <div class="title">さかなタップ！</div>
    <div class="sub">タップで魚を呼ぼう</div>
  </div>
  <div class="stats">
    <div class="card stat">🪙 <span id="coins">0</span></div>
    <div class="card stat">🐟 <span id="count">0</span></div>
  </div>
</div>
<div class="level"><div id="xpbar"></div></div>

<div class="bottom">
  <button id="feed"><span class="ico">🍤</span>エサ</button>
  <button id="gacha"><span class="ico">🎁</span>レア魚</button>
  <button id="book"><span class="ico">📖</span>図鑑</button>
  <button id="upgrade"><span class="ico">⬆️</span>強化</button>
  <button id="sound"><span class="ico">🔊</span>音</button>
</div>

<button id="installBtn" class="install">ホーム画面に追加</button>
<div id="toast" class="toast" aria-live="polite"></div>

<div id="modal" class="modal">
  <div class="sheet">
    <h2 id="modalTitle">図鑑</h2>
    <div id="modalBody"></div>
    <button id="closeModal" class="close">閉じる</button>
  </div>
</div>

<script>
(()=>{
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d",{alpha:false});
const coinsEl=document.getElementById("coins"),countEl=document.getElementById("count"),xpbar=document.getElementById("xpbar");
const toast=document.getElementById("toast"),modal=document.getElementById("modal"),modalTitle=document.getElementById("modalTitle"),modalBody=document.getElementById("modalBody");
let W=0,H=0,DPR=1,last=performance.now(),audioCtx=null,muted=false,deferredPrompt=null;

const species=[
{id:0,name:"カクレクマノミ",rarity:"ノーマル",value:1,body:"#ff7a26",accent:"#fff4e7",shape:"clown"},
{id:1,name:"ナンヨウハギ",rarity:"ノーマル",value:1,body:"#2467da",accent:"#ffe24f",shape:"tang"},
{id:2,name:"キイロハギ",rarity:"ノーマル",value:2,body:"#f5d930",accent:"#fff7a1",shape:"tang"},
{id:3,name:"ベタ",rarity:"レア",value:6,body:"#2754d9",accent:"#59b5ff",shape:"betta"},
{id:4,name:"ミノカサゴ",rarity:"レア",value:8,body:"#d65c36",accent:"#fff2dc",shape:"lion"},
{id:5,name:"金魚",rarity:"レア",value:10,body:"#f26422",accent:"#ffd09a",shape:"gold"},
{id:6,name:"フグ",rarity:"スーパーレア",value:18,body:"#d3a86d",accent:"#fff0cf",shape:"puffer"},
{id:7,name:"クラゲ",rarity:"スーパーレア",value:22,body:"#b986ff",accent:"#f4ddff",shape:"jelly"},
{id:8,name:"ウミガメ",rarity:"伝説",value:35,body:"#3f9e72",accent:"#9ddbb8",shape:"turtle"},
{id:9,name:"ジンベエザメ",rarity:"伝説",value:50,body:"#426f8f",accent:"#c9e9f7",shape:"whale"}
];

let state=JSON.parse(localStorage.getItem("sakanaV2")||"null")||{coins:120,xp:0,level:1,seen:[0,1,2],fish:[],upgrade:1};
let fishes=[],bubbles=[],food=[],sparkles=[];

function save(){
 state.coins=Math.floor(state.coins);state.xp=Math.floor(state.xp);state.level=Math.floor(state.level);
 state.fish=fishes.map(f=>({s:f.s,x:f.x/W,y:f.y/H,size:f.size,dir:f.dir}));
 localStorage.setItem("sakanaV2",JSON.stringify(state));
}
setInterval(save,3000);
window.addEventListener("pagehide",save);

function resize(){
 DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+"px";canvas.style.height=H+"px";
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);resize();

class Fish{
 constructor(s,x,y,size,dir){
  this.s=s;this.x=x??Math.random()*W;this.y=y??(H*.2+Math.random()*H*.62);
  this.size=size??(34+Math.random()*38);this.dir=dir??(Math.random()<.5?-1:1);
  this.speed=(35+Math.random()*45)*(1+s*.04);this.phase=Math.random()*6.28;
 }
 update(dt,t){
  let target=null,nd=1e12;
  for(const f of food){const dx=f.x-this.x,dy=f.y-this.y,d=dx*dx+dy*dy;if(d<nd){nd=d;target=f}}
  let vx=this.speed*this.dir,vy=Math.sin(t*.002+this.phase)*7;
  if(target&&nd<70000){const a=Math.atan2(target.y-this.y,target.x-this.x);vx=Math.cos(a)*this.speed*1.35;vy=Math.sin(a)*this.speed*1.35;this.dir=vx>=0?1:-1}
  this.x+=vx*dt;this.y+=vy*dt;
  if(this.x>W+120)this.x=-120;if(this.x<-120)this.x=W+120;
  this.y=Math.max(H*.18,Math.min(H*.84,this.y));
 }
 draw(){
  const sp=species[this.s],s=this.size;
  ctx.save();ctx.translate(this.x,this.y);ctx.scale(this.dir,1);
  ctx.shadowColor="rgba(0,0,0,.22)";ctx.shadowBlur=8;ctx.shadowOffsetY=4;

  if(sp.shape==="jelly"){drawJelly(sp,s);ctx.restore();return}
  if(sp.shape==="turtle"){drawTurtle(sp,s);ctx.restore();return}
  if(sp.shape==="whale"){drawWhale(sp,s);ctx.restore();return}

  const g=ctx.createLinearGradient(-s*.6,-s*.3,s*.6,s*.3);g.addColorStop(0,sp.accent);g.addColorStop(.25,sp.body);g.addColorStop(1,shade(sp.body,-25));
  ctx.fillStyle=g;
  if(sp.shape==="puffer"){
   ctx.beginPath();ctx.arc(0,0,s*.42,0,Math.PI*2);ctx.fill();
   for(let i=0;i<12;i++){const a=i/12*Math.PI*2;ctx.strokeStyle=sp.accent;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(Math.cos(a)*s*.36,Math.sin(a)*s*.36);ctx.lineTo(Math.cos(a)*s*.52,Math.sin(a)*s*.52);ctx.stroke()}
  }else{
   ctx.beginPath();ctx.ellipse(0,0,s*.64,s*.34,0,0,Math.PI*2);ctx.fill();
  }

  ctx.fillStyle=sp.body;ctx.beginPath();ctx.moveTo(-s*.53,0);ctx.lineTo(-s*.96,-s*.34);ctx.lineTo(-s*.82,0);ctx.lineTo(-s*.96,s*.34);ctx.closePath();ctx.fill();

  if(sp.shape==="betta"||sp.shape==="gold"){
   ctx.fillStyle=sp.accent;ctx.globalAlpha=.8;
   ctx.beginPath();ctx.moveTo(-s*.2,s*.22);ctx.quadraticCurveTo(-s*.05,s*.7,s*.28,s*.42);ctx.quadraticCurveTo(.05,s*.25,-s*.2,s*.22);ctx.fill();
   ctx.globalAlpha=1;
  }

  if(sp.shape==="clown"){
   ctx.strokeStyle=sp.accent;ctx.lineWidth=s*.11;
   [-.2,.18].forEach(x=>{ctx.beginPath();ctx.moveTo(s*x,-s*.27);ctx.lineTo(s*(x-.03),s*.27);ctx.stroke()});
  }
  if(sp.shape==="tang"){
   ctx.strokeStyle="#1b2a52";ctx.lineWidth=s*.06;ctx.beginPath();ctx.arc(-s*.05,0,s*.3,-1.2,1.2);ctx.stroke();
  }
  if(sp.shape==="lion"){
   ctx.strokeStyle=sp.accent;ctx.lineWidth=2;
   for(let i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(-s*.15+i*4,-s*.25);ctx.lineTo(-s*.2+i*7,-s*.55);ctx.stroke()}
  }

  ctx.shadowBlur=0;ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(s*.3,-s*.08,s*.085,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#10212a";ctx.beginPath();ctx.arc(s*.32,-s*.08,s*.045,0,Math.PI*2);ctx.fill();
  ctx.restore();
 }
}

function drawJelly(sp,s){
 ctx.fillStyle=sp.body;ctx.globalAlpha=.82;ctx.beginPath();ctx.arc(0,0,s*.4,Math.PI,0);ctx.lineTo(s*.4,s*.1);ctx.quadraticCurveTo(0,s*.28,-s*.4,s*.1);ctx.closePath();ctx.fill();
 ctx.strokeStyle=sp.accent;ctx.lineWidth=3;
 for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*s*.14,s*.1);ctx.bezierCurveTo(i*s*.1,s*.35,(i+1)*s*.1,s*.45,i*s*.08,s*.65);ctx.stroke()}
}
function drawTurtle(sp,s){
 ctx.fillStyle=sp.body;ctx.beginPath();ctx.ellipse(0,0,s*.48,s*.34,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=sp.accent;ctx.beginPath();ctx.arc(s*.52,-s*.03,s*.16,0,Math.PI*2);ctx.fill();
 [[-.1,-.22],[.05,.24],[-.32,.22],[-.35,-.2]].forEach(p=>{ctx.beginPath();ctx.ellipse(p[0]*s,p[1]*s,s*.22,s*.09,p[1]>0?.4:-.4,0,Math.PI*2);ctx.fill()});
 ctx.strokeStyle="#1d6948";ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,s*.32,0,Math.PI*2);ctx.stroke();
}
function drawWhale(sp,s){
 ctx.fillStyle=sp.body;ctx.beginPath();ctx.ellipse(0,0,s*.78,s*.32,0,0,Math.PI*2);ctx.fill();
 ctx.beginPath();ctx.moveTo(-s*.62,0);ctx.lineTo(-s*1.05,-s*.3);ctx.lineTo(-s*.9,0);ctx.lineTo(-s*1.05,s*.3);ctx.closePath();ctx.fill();
 ctx.fillStyle=sp.accent;for(let i=0;i<12;i++){ctx.beginPath();ctx.arc(-s*.3+i*s*.07,-s*.1+(i%2)*6,2.2,0,Math.PI*2);ctx.fill()}
 ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(s*.45,-s*.08,s*.06,0,Math.PI*2);ctx.fill();ctx.fillStyle="#111";ctx.beginPath();ctx.arc(s*.46,-s*.08,s*.03,0,Math.PI*2);ctx.fill();
}
function shade(hex,amt){let c=hex.replace("#",""),n=parseInt(c,16),r=Math.max(0,Math.min(255,(n>>16)+amt)),g=Math.max(0,Math.min(255,((n>>8)&255)+amt)),b=Math.max(0,Math.min(255,(n&255)+amt));return"#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}

function addFish(s,x,y){
 if(fishes.length>=180){show("魚は180匹まで！");return}
 const f=new Fish(s,x,y);fishes.push(f);
 if(!state.seen.includes(s)){state.seen.push(s);show("NEW！ "+species[s].name)}
 state.xp+=5;state.coins+=species[s].value;
 sparkles.push({x:f.x,y:f.y,r:3,a:1});updateUI();blip(600+s*40);
}
function randomNormal(){return Math.floor(Math.random()*3)}
function show(msg){toast.textContent=msg;toast.classList.add("show");clearTimeout(show.t);show.t=setTimeout(()=>toast.classList.remove("show"),900)}
function updateUI(){
 coinsEl.textContent=Math.floor(state.coins).toLocaleString();countEl.textContent=fishes.length;
 const need=100+state.level*30;
 while(state.xp>=need){state.xp-=need;state.level++;show("レベル "+state.level+"！")}
 xpbar.style.width=Math.min(100,state.xp/need*100)+"%";
}
function blip(freq=660){
 if(muted)return;
 try{audioCtx||=new (AudioContext||webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.frequency.exponentialRampToValueAtTime(freq*1.35,audioCtx.currentTime+.08);g.gain.value=.035;g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.14);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.15)}catch(e){}
}

canvas.addEventListener("pointerdown",e=>{
 const r=canvas.getBoundingClientRect();addFish(randomNormal(),e.clientX-r.left,e.clientY-r.top);
},{passive:true});

document.getElementById("feed").onclick=()=>{
 if(state.coins<10){show("コインが足りない");return}
 state.coins-=10;for(let i=0;i<10;i++)food.push({x:W*.15+Math.random()*W*.7,y:H*.25+Math.random()*H*.28,vy:14+Math.random()*20,life:8});show("エサをまいた！");updateUI()
};
document.getElementById("gacha").onclick=()=>{
 if(state.coins<100){show("100コイン必要");return}
 state.coins-=100;
 const r=Math.random();let s=r<.02?9:r<.06?8:r<.16?(6+Math.floor(Math.random()*2)):(3+Math.floor(Math.random()*3));
 addFish(s,W*.5,H*.45);updateUI()
};
document.getElementById("upgrade").onclick=()=>{
 const cost=200*state.upgrade;
 if(state.coins<cost){show(cost+"コイン必要");return}
 state.coins-=cost;state.upgrade++;
 fishes.forEach(f=>f.speed*=1.05);show("魚の元気 Lv."+state.upgrade);updateUI()
};
document.getElementById("sound").onclick=e=>{muted=!muted;e.currentTarget.querySelector(".ico").textContent=muted?"🔇":"🔊"};
document.getElementById("book").onclick=()=>{
 modalTitle.textContent="魚図鑑 "+state.seen.length+"/"+species.length;
 modalBody.innerHTML='<div class="grid">'+species.map(sp=>`<div class="fishcard ${state.seen.includes(sp.id)?"":"locked"}"><span class="badge">${sp.rarity}</span><div class="name">${state.seen.includes(sp.id)?sp.name:"？？？"}</div><div class="small">1匹 ${sp.value}コイン</div></div>`).join("")+"</div>";
 modal.classList.add("open")
};
document.getElementById("closeModal").onclick=()=>modal.classList.remove("open");
modal.addEventListener("pointerdown",e=>{if(e.target===modal)modal.classList.remove("open")});

function bg(t){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#80dcff");g.addColorStop(.19,"#13a8d8");g.addColorStop(1,"#034a77");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.globalAlpha=.11;ctx.fillStyle="#fff";for(let i=0;i<6;i++){const x=i*W/5-40+Math.sin(t*.0003+i)*30;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+W*.08,H);ctx.lineTo(x+W*.18,H);ctx.lineTo(x+W*.06,0);ctx.fill()}ctx.globalAlpha=1;
 ctx.fillStyle="#e7c783";ctx.beginPath();ctx.moveTo(0,H*.88);for(let x=0;x<=W;x+=30)ctx.lineTo(x,H*.88+Math.sin(x*.03+t*.0006)*7);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
 for(let i=0;i<12;i++){const x=(i+.3)*W/12,h=35+(i%4)*18;ctx.strokeStyle=i%2?"#168052":"#269c60";ctx.lineWidth=7;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(x,H*.93);ctx.quadraticCurveTo(x+Math.sin(t*.001+i)*15,H*.93-h*.55,x+Math.sin(t*.001+i)*10,H*.93-h);ctx.stroke()}
}
function loop(now){
 const dt=Math.min((now-last)/1000,.034);last=now;
 if(Math.random()<dt*1.6)bubbles.push({x:Math.random()*W,y:H+8,r:2+Math.random()*7,vy:20+Math.random()*28,a:.5});
 bubbles.forEach(b=>{b.y-=b.vy*dt;b.x+=Math.sin(now*.002+b.y*.02)*7*dt});bubbles=bubbles.filter(b=>b.y>-20);
 food.forEach(f=>{f.y+=f.vy*dt;f.life-=dt});food=food.filter(f=>f.life>0&&f.y<H*.84);
 fishes.forEach(f=>f.update(dt,now));sparkles.forEach(s=>{s.r+=24*dt;s.a-=1.7*dt});sparkles=sparkles.filter(s=>s.a>0);

 bg(now);
 ctx.strokeStyle="rgba(255,255,255,.62)";ctx.lineWidth=1.5;bubbles.forEach(b=>{ctx.globalAlpha=b.a;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.stroke()});ctx.globalAlpha=1;
 food.forEach(f=>{ctx.fillStyle="#f5b163";ctx.beginPath();ctx.arc(f.x,f.y,4,0,Math.PI*2);ctx.fill()});
 fishes.forEach(f=>f.draw());
 sparkles.forEach(s=>{ctx.globalAlpha=s.a;ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.stroke()});ctx.globalAlpha=1;
 requestAnimationFrame(loop)
}

if(state.fish.length){
 fishes=state.fish.map(o=>new Fish(o.s,o.x*W,o.y*H,o.size,o.dir));
}else{
 [0,0,1,1,2,2,0,1].forEach((s,i)=>fishes.push(new Fish(s,W*(.1+i*.11),H*(.3+(i%3)*.16),36+Math.random()*22,i%2?1:-1)))
}
updateUI();requestAnimationFrame(loop);

window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;document.getElementById("installBtn").style.display="block"});
document.getElementById("installBtn").onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById("installBtn").style.display="none"};

if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
})();
</script>
</body>
</html>
