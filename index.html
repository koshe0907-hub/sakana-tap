<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#063557">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="さかなタップ">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>さかなタップ！Ver.4</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#062c49;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
    body{position:fixed;inset:0}
    canvas{display:block;width:100%;height:100%}

    .hud{position:fixed;z-index:10;left:10px;right:10px;top:max(10px,env(safe-area-inset-top));display:flex;justify-content:space-between;gap:8px;pointer-events:none}
    .glass{background:rgba(2,32,55,.64);color:#fff;border:1px solid rgba(255,255,255,.24);border-radius:18px;padding:9px 12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 24px rgba(0,0,0,.18)}
    .title{font-weight:900;font-size:17px}
    .sub{font-size:11px;opacity:.9}
    .stats{display:flex;gap:7px}
    .stat{font-weight:900;font-size:14px;white-space:nowrap}

    .levelbar{position:fixed;z-index:11;left:10px;top:82px;width:155px;height:9px;border-radius:999px;background:rgba(255,255,255,.22);overflow:hidden}
    .levelbar>div{height:100%;width:0;background:linear-gradient(90deg,#ffe071,#ff9b42)}
    .leveltext{position:fixed;z-index:11;left:12px;top:94px;color:#fff;font-size:11px;font-weight:800;text-shadow:0 2px 5px rgba(0,0,0,.4)}

    .bottom{position:fixed;z-index:12;left:7px;right:7px;bottom:max(9px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
    button{appearance:none;border:1px solid rgba(255,255,255,.27);background:rgba(2,44,70,.76);color:#fff;border-radius:15px;padding:8px 3px;font-weight:850;font-size:10px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 5px 14px rgba(0,0,0,.18)}
    button:active{transform:scale(.96)}
    button .ico{display:block;font-size:21px;margin-bottom:1px}

    .toast{position:fixed;z-index:50;left:50%;top:21%;transform:translate(-50%,-50%) scale(.9);opacity:0;pointer-events:none;background:rgba(0,29,48,.86);color:#fff;padding:10px 15px;border-radius:999px;font-weight:850;transition:.18s;white-space:nowrap}
    .toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

    .modal{position:fixed;z-index:40;inset:0;background:rgba(0,18,31,.74);display:none;align-items:flex-end;justify-content:center;padding:8px}
    .modal.open{display:flex}
    .sheet{width:min(700px,100%);max-height:79vh;overflow:auto;background:#f6fbff;border-radius:25px 25px 18px 18px;padding:16px;color:#083650;box-shadow:0 -12px 45px rgba(0,0,0,.28)}
    .sheet h2{margin:0 0 12px;font-size:20px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .fishcard{border:1px solid #cce1ee;border-radius:16px;padding:10px;background:#fff;min-height:112px}
    .fishcard.locked{filter:grayscale(1);opacity:.5}
    .badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#e8f3fa;font-size:10px;font-weight:800}
    .name{font-weight:900;margin-top:7px}
    .small{font-size:11px;color:#60798a;margin-top:3px}
    .close{width:100%;margin-top:14px;background:#0b729f;font-size:15px}
    .reward{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0}
    .day{background:#fff;border:1px solid #d5e5ee;border-radius:11px;padding:8px 2px;text-align:center;font-size:10px}
    .day.done{background:#e0f7e7}
    .big{font-size:34px;text-align:center;margin:12px}
    .install{position:fixed;z-index:15;right:10px;bottom:76px;display:none;background:#fff;color:#0d5575;border:0;padding:9px 12px;font-size:12px;border-radius:999px}

    @media (min-width:700px){
      .grid{grid-template-columns:repeat(4,1fr)}
      .bottom{left:50%;transform:translateX(-50%);width:650px}
      .title{font-size:20px}
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="魚を集めて育てる水族館ゲーム"></canvas>

  <div class="hud">
    <div class="glass">
      <div class="title">さかなタップ！</div>
      <div class="sub">タップで魚を呼ぼう</div>
    </div>
    <div class="stats">
      <div class="glass stat">🪙 <span id="coins">0</span></div>
      <div class="glass stat">🐟 <span id="count">0</span></div>
    </div>
  </div>

  <div class="levelbar"><div id="xpbar"></div></div>
  <div class="leveltext">Lv.<span id="level">1</span></div>

  <div class="bottom">
    <button id="feed" type="button"><span class="ico">🍤</span>エサ</button>
    <button id="gacha" type="button"><span class="ico">🎁</span>ガチャ</button>
    <button id="book" type="button"><span class="ico">📖</span>図鑑</button>
    <button id="daily" type="button"><span class="ico">🎉</span>毎日</button>
    <button id="sound" type="button"><span class="ico">🔊</span>音</button>
  </div>

  <button id="installBtn" class="install" type="button">ホーム画面に追加</button>
  <div id="toast" class="toast" aria-live="polite"></div>

  <div id="modal" class="modal">
    <div class="sheet">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <button id="closeModal" class="close" type="button">閉じる</button>
    </div>
  </div>

  <script>
  (() => {
    "use strict";

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d", { alpha: false });
    const coinsEl = document.getElementById("coins");
    const countEl = document.getElementById("count");
    const xpbar = document.getElementById("xpbar");
    const levelEl = document.getElementById("level");
    const toast = document.getElementById("toast");
    const modal = document.getElementById("modal");
    const modalTitle = document.getElementById("modalTitle");
    const modalBody = document.getElementById("modalBody");

    let W = 0;
    let H = 0;
    let DPR = 1;
    let last = performance.now();
    let audioCtx = null;
    let muted = false;
    let deferredPrompt = null;

    const species = [
      {id:0,name:"カクレクマノミ",rarity:"ノーマル",value:1,body:"#ff7824",accent:"#fff4e9",shape:"clown"},
      {id:1,name:"ナンヨウハギ",rarity:"ノーマル",value:1,body:"#2364d8",accent:"#ffe250",shape:"tang"},
      {id:2,name:"キイロハギ",rarity:"ノーマル",value:2,body:"#f4d832",accent:"#fff7a0",shape:"tang"},
      {id:3,name:"ネオンテトラ",rarity:"ノーマル",value:2,body:"#1b8dcc",accent:"#ff4b4b",shape:"slim"},
      {id:4,name:"ベタ",rarity:"レア",value:6,body:"#284fd6",accent:"#6dc6ff",shape:"betta"},
      {id:5,name:"ミノカサゴ",rarity:"レア",value:8,body:"#d05c38",accent:"#fff0dc",shape:"lion"},
      {id:6,name:"金魚",rarity:"レア",value:10,body:"#f26821",accent:"#ffd09b",shape:"gold"},
      {id:7,name:"フグ",rarity:"スーパーレア",value:18,body:"#cba770",accent:"#fff1ce",shape:"puffer"},
      {id:8,name:"クラゲ",rarity:"スーパーレア",value:22,body:"#ad82f1",accent:"#f5dcff",shape:"jelly"},
      {id:9,name:"ウミガメ",rarity:"伝説",value:35,body:"#419b70",accent:"#9dd8b6",shape:"turtle"},
      {id:10,name:"ジンベエザメ",rarity:"伝説",value:50,body:"#426e8e",accent:"#cbeaf7",shape:"whale"},
      {id:11,name:"黄金の魚",rarity:"幻",value:100,body:"#f4b52d",accent:"#fff4ad",shape:"gold"}
    ];

    const defaultState = {
      coins:150,
      xp:0,
      level:1,
      seen:[0,1,2],
      fish:[],
      lastSave:Date.now(),
      lastDaily:"",
      streak:0,
      totalTaps:0
    };

    let state = Object.assign(
      {},
      defaultState,
      JSON.parse(localStorage.getItem("sakanaV4") || "null") || {}
    );

    let fishes = [];
    let bubbles = [];
    let food = [];
    let sparkles = [];
    let coinsFx = [];

    function save() {
      state.coins = Math.floor(state.coins);
      state.xp = Math.floor(state.xp);
      state.level = Math.floor(state.level);
      state.fish = fishes.map(f => ({
        s:f.s,
        x:f.x / W,
        y:f.y / H,
        size:f.size,
        dir:f.dir
      }));
      state.lastSave = Date.now();
      localStorage.setItem("sakanaV4", JSON.stringify(state));
    }

    setInterval(save, 2500);
    window.addEventListener("pagehide", save);

    function resize() {
      DPR = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth;
      H = innerHeight;
      canvas.width = Math.round(W * DPR);
      canvas.height = Math.round(H * DPR);
      canvas.style.width = W + "px";
      canvas.style.height = H + "px";
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }

    addEventListener("resize", resize);
    resize();

    class Fish {
      constructor(s, x, y, size, dir) {
        this.s = s;
        this.x = x ?? Math.random() * W;
        this.y = y ?? (H * 0.2 + Math.random() * H * 0.61);
        this.size = size ?? (32 + Math.random() * 36);
        this.dir = dir ?? (Math.random() < 0.5 ? -1 : 1);
        this.speed = (34 + Math.random() * 46) * (1 + s * 0.028);
        this.phase = Math.random() * Math.PI * 2;
        this.wobble = Math.random() * 1.5 + 0.5;
      }

      update(dt, t) {
        let vx = this.speed * this.dir;
        let vy = Math.sin(t * 0.0018 * this.wobble + this.phase) * 7;

        let target = null;
        let nearest = Infinity;

        for (const pellet of food) {
          const dx = pellet.x - this.x;
          const dy = pellet.y - this.y;
          const dist = dx * dx + dy * dy;
          if (dist < nearest) {
            nearest = dist;
            target = pellet;
          }
        }

        if (target && nearest < 80000) {
          const angle = Math.atan2(target.y - this.y, target.x - this.x);
          vx = Math.cos(angle) * this.speed * 1.38;
          vy = Math.sin(angle) * this.speed * 1.38;
          this.dir = vx >= 0 ? 1 : -1;
        }

        this.x += vx * dt;
        this.y += vy * dt;

        if (this.x > W + 140) this.x = -140;
        if (this.x < -140) this.x = W + 140;

        this.y = Math.max(H * 0.18, Math.min(H * 0.83, this.y));
      }

      draw() {
        const sp = species[this.s];
        const s = this.size;

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(this.dir, 1);
        ctx.shadowColor = "rgba(0,0,0,.20)";
        ctx.shadowBlur = 8;
        ctx.shadowOffsetY = 4;

        if (sp.shape === "jelly") {
          drawJelly(sp, s);
          ctx.restore();
          return;
        }

        if (sp.shape === "turtle") {
          drawTurtle(sp, s);
          ctx.restore();
          return;
        }

        if (sp.shape === "whale") {
          drawWhale(sp, s);
          ctx.restore();
          return;
        }

        const gradient = ctx.createLinearGradient(-s * 0.65, -s * 0.3, s * 0.65, s * 0.3);
        gradient.addColorStop(0, sp.accent);
        gradient.addColorStop(0.28, sp.body);
        gradient.addColorStop(1, shade(sp.body, -30));
        ctx.fillStyle = gradient;

        if (sp.shape === "puffer") {
          ctx.beginPath();
          ctx.arc(0, 0, s * 0.42, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = sp.accent;
          ctx.lineWidth = 2;

          for (let i = 0; i < 13; i++) {
            const a = i / 13 * Math.PI * 2;
            ctx.beginPath();
            ctx.moveTo(Math.cos(a) * s * 0.36, Math.sin(a) * s * 0.36);
            ctx.lineTo(Math.cos(a) * s * 0.52, Math.sin(a) * s * 0.52);
            ctx.stroke();
          }
        } else if (sp.shape === "slim") {
          ctx.beginPath();
          ctx.ellipse(0, 0, s * 0.68, s * 0.23, 0, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.ellipse(0, 0, s * 0.64, s * 0.34, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = sp.body;
        ctx.beginPath();
        ctx.moveTo(-s * 0.53, 0);
        ctx.lineTo(-s * 0.97, -s * 0.35);
        ctx.lineTo(-s * 0.82, 0);
        ctx.lineTo(-s * 0.97, s * 0.35);
        ctx.closePath();
        ctx.fill();

        if (sp.shape === "betta" || sp.shape === "gold") {
          ctx.fillStyle = sp.accent;
          ctx.globalAlpha = 0.82;
          ctx.beginPath();
          ctx.moveTo(-s * 0.18, s * 0.2);
          ctx.quadraticCurveTo(-s * 0.05, s * 0.72, s * 0.34, s * 0.42);
          ctx.quadraticCurveTo(s * 0.08, s * 0.23, -s * 0.18, s * 0.2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }

        if (sp.shape === "clown") {
          ctx.strokeStyle = sp.accent;
          ctx.lineWidth = s * 0.115;
          [-0.22, 0.17].forEach(x => {
            ctx.beginPath();
            ctx.moveTo(s * x, -s * 0.27);
            ctx.lineTo(s * (x - 0.03), s * 0.27);
            ctx.stroke();
          });
        }

        if (sp.shape === "tang") {
          ctx.strokeStyle = "#152652";
          ctx.lineWidth = s * 0.06;
          ctx.beginPath();
          ctx.arc(-s * 0.05, 0, s * 0.3, -1.15, 1.15);
          ctx.stroke();
        }

        if (sp.shape === "slim") {
          ctx.strokeStyle = sp.accent;
          ctx.lineWidth = s * 0.07;
          ctx.beginPath();
          ctx.moveTo(-s * 0.4, 0);
          ctx.lineTo(s * 0.36, 0);
          ctx.stroke();
        }

        if (sp.shape === "lion") {
          ctx.strokeStyle = sp.accent;
          ctx.lineWidth = 2;
          for (let i = -3; i <= 3; i++) {
            ctx.beginPath();
            ctx.moveTo(-s * 0.16 + i * 4, -s * 0.23);
            ctx.lineTo(-s * 0.2 + i * 7, -s * 0.58);
            ctx.stroke();
          }
        }

        ctx.shadowBlur = 0;
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(s * 0.3, -s * 0.08, s * 0.085, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#10212a";
        ctx.beginPath();
        ctx.arc(s * 0.32, -s * 0.08, s * 0.045, 0, Math.PI * 2);
        ctx.fill();

        if (this.s === 11) {
          ctx.strokeStyle = "rgba(255,255,190,.8)";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(0, 0, s * 0.8, 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.restore();
      }
    }

    function drawJelly(sp, s) {
      ctx.fillStyle = sp.body;
      ctx.globalAlpha = 0.82;
      ctx.beginPath();
      ctx.arc(0, 0, s * 0.4, Math.PI, 0);
      ctx.lineTo(s * 0.4, s * 0.1);
      ctx.quadraticCurveTo(0, s * 0.3, -s * 0.4, s * 0.1);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = sp.accent;
      ctx.lineWidth = 3;

      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(i * s * 0.14, s * 0.1);
        ctx.bezierCurveTo(i * s * 0.1, s * 0.36, (i + 1) * s * 0.1, s * 0.5, i * s * 0.08, s * 0.68);
        ctx.stroke();
      }
    }

    function drawTurtle(sp, s) {
      ctx.fillStyle = sp.body;
      ctx.beginPath();
      ctx.ellipse(0, 0, s * 0.48, s * 0.34, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = sp.accent;
      ctx.beginPath();
      ctx.arc(s * 0.52, -s * 0.03, s * 0.16, 0, Math.PI * 2);
      ctx.fill();

      [[-0.1,-0.22],[0.05,0.24],[-0.32,0.22],[-0.35,-0.2]].forEach(p => {
        ctx.beginPath();
        ctx.ellipse(p[0] * s, p[1] * s, s * 0.22, s * 0.09, p[1] > 0 ? 0.4 : -0.4, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.strokeStyle = "#1d6948";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, s * 0.32, 0, Math.PI * 2);
      ctx.stroke();
    }

    function drawWhale(sp, s) {
      ctx.fillStyle = sp.body;
      ctx.beginPath();
      ctx.ellipse(0, 0, s * 0.78, s * 0.32, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(-s * 0.62, 0);
      ctx.lineTo(-s * 1.05, -s * 0.3);
      ctx.lineTo(-s * 0.9, 0);
      ctx.lineTo(-s * 1.05, s * 0.3);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = sp.accent;
      for (let i = 0; i < 13; i++) {
        ctx.beginPath();
        ctx.arc(-s * 0.34 + i * s * 0.075, -s * 0.1 + (i % 2) * 6, 2.1, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(s * 0.45, -s * 0.08, s * 0.06, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#111";
      ctx.beginPath();
      ctx.arc(s * 0.46, -s * 0.08, s * 0.03, 0, Math.PI * 2);
      ctx.fill();
    }

    function shade(hex, amount) {
      const c = hex.replace("#", "");
      const n = parseInt(c, 16);
      const r = Math.max(0, Math.min(255, (n >> 16) + amount));
      const g = Math.max(0, Math.min(255, ((n >> 8) & 255) + amount));
      const b = Math.max(0, Math.min(255, (n & 255) + amount));
      return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }

    function addFish(s, x, y, free = false) {
      if (fishes.length >= 200) {
        show("魚は200匹まで！");
        return;
      }

      const fish = new Fish(s, x, y);
      fishes.push(fish);

      if (!state.seen.includes(s)) {
        state.seen.push(s);
        show("NEW！ " + species[s].name);
      }

      if (!free) {
        state.coins += species[s].value;
        state.xp += 5;
      }

      sparkles.push({x:fish.x,y:fish.y,r:3,a:1});
      coinsFx.push({x:fish.x,y:fish.y,a:1,text:"+" + species[s].value});
      updateUI();
      blip(610 + s * 32);
    }

    function randomNormal() {
      return Math.floor(Math.random() * 4);
    }

    function show(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(show.timer);
      show.timer = setTimeout(() => toast.classList.remove("show"), 950);
    }

    function updateUI() {
      let need = 100 + state.level * 35;

      while (state.xp >= need) {
        state.xp -= need;
        state.level++;
        show("レベル " + state.level + "！");
        need = 100 + state.level * 35;
      }

      coinsEl.textContent = Math.floor(state.coins).toLocaleString();
      countEl.textContent = fishes.length;
      levelEl.textContent = state.level;
      xpbar.style.width = Math.min(100, state.xp / need * 100) + "%";
    }

    function blip(freq = 660) {
      if (muted) return;

      try {
        audioCtx ||= new (AudioContext || webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        oscillator.frequency.value = freq;
        oscillator.frequency.exponentialRampToValueAtTime(freq * 1.3, audioCtx.currentTime + 0.08);

        gain.gain.value = 0.03;
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.14);

        oscillator.connect(gain);
        gain.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.15);
      } catch (_) {}
    }

    canvas.addEventListener("pointerdown", event => {
      const rect = canvas.getBoundingClientRect();
      state.totalTaps++;
      addFish(randomNormal(), event.clientX - rect.left, event.clientY - rect.top);
    }, { passive:true });

    document.getElementById("feed").addEventListener("click", () => {
      if (state.coins < 15) {
        show("15コイン必要");
        return;
      }

      state.coins -= 15;

      for (let i = 0; i < 12; i++) {
        food.push({
          x:W * 0.12 + Math.random() * W * 0.76,
          y:H * 0.24 + Math.random() * H * 0.3,
          vy:14 + Math.random() * 20,
          life:8
        });
      }

      show("魚が集まってきた！");
      updateUI();
    });

    document.getElementById("gacha").addEventListener("click", () => {
      modalTitle.textContent = "レア魚ガチャ";
      modalBody.innerHTML = `
        <div class="big">🎁</div>
        <p>100コインでレア魚が1匹出るよ。伝説や幻も入ってる！</p>
        <button id="drawGacha" class="close" type="button">100コインで引く</button>
      `;
      modal.classList.add("open");

      document.getElementById("drawGacha").addEventListener("click", () => {
        if (state.coins < 100) {
          show("100コイン必要");
          return;
        }

        state.coins -= 100;

        const r = Math.random();
        let s;

        if (r < 0.008) s = 11;
        else if (r < 0.03) s = 10;
        else if (r < 0.07) s = 9;
        else if (r < 0.18) s = 7 + Math.floor(Math.random() * 2);
        else s = 4 + Math.floor(Math.random() * 3);

        addFish(s, W * 0.5, H * 0.45, true);
        updateUI();
        modal.classList.remove("open");
      }, { once:true });
    });

    document.getElementById("book").addEventListener("click", () => {
      modalTitle.textContent = "魚図鑑 " + state.seen.length + "/" + species.length;
      modalBody.innerHTML = '<div class="grid">' + species.map(sp => `
        <div class="fishcard ${state.seen.includes(sp.id) ? "" : "locked"}">
          <span class="badge">${sp.rarity}</span>
          <div class="name">${state.seen.includes(sp.id) ? sp.name : "？？？"}</div>
          <div class="small">1匹 ${sp.value}コイン</div>
        </div>
      `).join("") + "</div>";
      modal.classList.add("open");
    });

    document.getElementById("daily").addEventListener("click", () => {
      const today = new Date().toISOString().slice(0, 10);
      const rewards = [50,75,100,125,150,200,300];

      modalTitle.textContent = "デイリーボーナス";
      modalBody.innerHTML = `
        <div class="reward">
          ${rewards.map((reward, i) => `
            <div class="day ${i < state.streak ? "done" : ""}">
              ${i + 1}日<br>🪙${reward}
            </div>
          `).join("")}
        </div>
        <button id="claimDaily" class="close" type="button">
          ${state.lastDaily === today ? "今日は受取済み" : "受け取る"}
        </button>
      `;

      modal.classList.add("open");

      document.getElementById("claimDaily").addEventListener("click", () => {
        if (state.lastDaily === today) {
          show("今日はもう受け取ったよ");
          return;
        }

        const reward = rewards[Math.min(state.streak, rewards.length - 1)];
        state.coins += reward;
        state.streak = (state.streak + 1) % 7;
        state.lastDaily = today;

        show(reward + "コイン獲得！");
        updateUI();
        save();
        modal.classList.remove("open");
      }, { once:true });
    });

    document.getElementById("sound").addEventListener("click", event => {
      muted = !muted;
      event.currentTarget.querySelector(".ico").textContent = muted ? "🔇" : "🔊";
    });

    document.getElementById("closeModal").addEventListener("click", () => {
      modal.classList.remove("open");
    });

    modal.addEventListener("pointerdown", event => {
      if (event.target === modal) modal.classList.remove("open");
    });

    function drawBackground(t) {
      const gradient = ctx.createLinearGradient(0, 0, 0, H);
      gradient.addColorStop(0, "#7edcff");
      gradient.addColorStop(0.18, "#14a9d8");
      gradient.addColorStop(1, "#03476f");

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, W, H);

      ctx.globalAlpha = 0.11;
      ctx.fillStyle = "#fff";

      for (let i = 0; i < 6; i++) {
        const x = i * W / 5 - 40 + Math.sin(t * 0.0003 + i) * 30;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x + W * 0.08, H);
        ctx.lineTo(x + W * 0.18, H);
        ctx.lineTo(x + W * 0.06, 0);
        ctx.fill();
      }

      ctx.globalAlpha = 1;

      ctx.fillStyle = "#e5c47d";
      ctx.beginPath();
      ctx.moveTo(0, H * 0.88);

      for (let x = 0; x <= W; x += 30) {
        ctx.lineTo(x, H * 0.88 + Math.sin(x * 0.03 + t * 0.0006) * 7);
      }

      ctx.lineTo(W, H);
      ctx.lineTo(0, H);
      ctx.fill();

      for (let i = 0; i < 13; i++) {
        const x = (i + 0.25) * W / 13;
        const h = 34 + (i % 4) * 19;

        ctx.strokeStyle = i % 2 ? "#167f51" : "#269b60";
        ctx.lineWidth = 7;
        ctx.lineCap = "round";

        ctx.beginPath();
        ctx.moveTo(x, H * 0.93);
        ctx.quadraticCurveTo(
          x + Math.sin(t * 0.001 + i) * 15,
          H * 0.93 - h * 0.55,
          x + Math.sin(t * 0.001 + i) * 10,
          H * 0.93 - h
        );
        ctx.stroke();
      }

      ctx.fillStyle = "#704b43";
      ctx.beginPath();
      ctx.ellipse(W * 0.12, H * 0.89, 34, 18, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#7f6052";
      ctx.beginPath();
      ctx.ellipse(W * 0.78, H * 0.9, 44, 22, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function loop(now) {
      const dt = Math.min((now - last) / 1000, 0.034);
      last = now;

      if (Math.random() < dt * 1.6) {
        bubbles.push({
          x:Math.random() * W,
          y:H + 8,
          r:2 + Math.random() * 7,
          vy:20 + Math.random() * 28,
          a:0.5
        });
      }

      bubbles.forEach(b => {
        b.y -= b.vy * dt;
        b.x += Math.sin(now * 0.002 + b.y * 0.02) * 7 * dt;
      });
      bubbles = bubbles.filter(b => b.y > -20);

      food.forEach(f => {
        f.y += f.vy * dt;
        f.life -= dt;
      });
      food = food.filter(f => f.life > 0 && f.y < H * 0.84);

      fishes.forEach(f => f.update(dt, now));

      sparkles.forEach(s => {
        s.r += 24 * dt;
        s.a -= 1.7 * dt;
      });
      sparkles = sparkles.filter(s => s.a > 0);

      coinsFx.forEach(c => {
        c.y -= 22 * dt;
        c.a -= 1.2 * dt;
      });
      coinsFx = coinsFx.filter(c => c.a > 0);

      drawBackground(now);

      ctx.strokeStyle = "rgba(255,255,255,.62)";
      ctx.lineWidth = 1.5;

      bubbles.forEach(b => {
        ctx.globalAlpha = b.a;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.stroke();
      });

      ctx.globalAlpha = 1;

      food.forEach(f => {
        ctx.fillStyle = "#f5b163";
        ctx.beginPath();
        ctx.arc(f.x, f.y, 4, 0, Math.PI * 2);
        ctx.fill();
      });

      fishes.forEach(f => f.draw());

      sparkles.forEach(s => {
        ctx.globalAlpha = s.a;
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.stroke();
      });

      ctx.font = "bold 15px system-ui";
      ctx.textAlign = "center";

      coinsFx.forEach(c => {
        ctx.globalAlpha = c.a;
        ctx.fillStyle = "#ffe376";
        ctx.fillText(c.text, c.x, c.y);
      });

      ctx.globalAlpha = 1;
      requestAnimationFrame(loop);
    }

    if (state.fish.length) {
      fishes = state.fish.map(o => new Fish(o.s, o.x * W, o.y * H, o.size, o.dir));
    } else {
      [0,0,1,1,2,2,3,0].forEach((s, i) => {
        fishes.push(new Fish(
          s,
          W * (0.1 + i * 0.11),
          H * (0.31 + (i % 3) * 0.15),
          35 + Math.random() * 20,
          i % 2 ? 1 : -1
        ));
      });
    }

    const elapsed = Math.max(0, Date.now() - (state.lastSave || Date.now()));
    const offlineReward = Math.min(500, Math.floor(elapsed / 60000) * 2);

    if (offlineReward > 0) {
      state.coins += offlineReward;
      setTimeout(() => show("放置報酬 " + offlineReward + "コイン！"), 650);
    }

    updateUI();
    requestAnimationFrame(loop);

    window.addEventListener("beforeinstallprompt", event => {
      event.preventDefault();
      deferredPrompt = event;
      document.getElementById("installBtn").style.display = "block";
    });

    document.getElementById("installBtn").addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      document.getElementById("installBtn").style.display = "none";
    });

    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  })();
  </script>
</body>
</html>
